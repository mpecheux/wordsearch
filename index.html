<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Mots mêlés 3D</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #121212; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
  #app { display: flex; flex-direction: column; height: 100%; align-items: center; }
  #hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; padding: 10px 12px; background: #1c1c1c; border-bottom: 1px solid #333; }
  #hud > *, #hud button { height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 16px; font-weight: 600; padding: 0 6px; background: #2c2c2c; color: #eee; border: 0; white-space: nowrap; }
  #hud button { background: #444; }
  #hud button:active { background: #666; }
  #hud .stat { flex-direction: column; line-height: 1.1; font-size: 20px; }
  #hud .stat small { font-size: 10px; font-weight: 400; opacity: .6; text-transform: uppercase; letter-spacing: 1px; }
  #target { display: flex; gap: 8px; justify-content: center; margin: 18px 0 6px; }
  #target .t { width: clamp(44px, 14vw, 72px); aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #3a3a3a; border-radius: 10px; font-size: clamp(28px, 9vw, 46px); font-weight: 800; color: #fff; box-shadow: inset 2px 2px 3px rgba(255,255,255,.12), inset -3px -3px 4px rgba(0,0,0,.4); }
  button { background: #d8d8d8; color: #111; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
  button:active { background: #fff; }
  #scene { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; perspective: 1400px; touch-action: none; cursor: grab; min-height: 0; }
  #cube { --s: 300px; width: var(--s); height: var(--s); position: relative; transform-style: preserve-3d; }
  .face { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr);   gap: 7px; padding: 4px; background: #000; backface-visibility: hidden; }
    .cell { display: flex; align-items: center; justify-content: center;     background-color: #4a4a4a; color: #fff; border-radius: 9px; font-weight: 700; font-size: calc(var(--s) / 9);
      background-image: linear-gradient(135deg, rgba(255,255,255,.06), rgba(0,0,0,.12));
      box-shadow: inset 2px 2px 3px rgba(255,255,255,.14), inset -3px -3px 4px rgba(0,0,0,.4); }
    .cell.sel { background-color: #c9b458; color: #000; }
    .cell.ok { background-color: #6aaa64; color: #000; }
    .cell.bad { background-color: #333; }
  #cube.hidden .cell { color: transparent; }
  .overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(10, 10, 10, .85); z-index: 10; text-align: center; }
  .overlay.show { display: flex; }
  #count { font-size: 120px; font-weight: 800; color: #fff; pointer-events: none; }
  #final { font-size: 28px; }
  #hint { font-size: 12px; opacity: .6; padding: 6px; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat"><small>Temps</small><span><span id="time">120</span>s</span></div>
    <div class="stat"><small>Score</small><span id="score">0</span></div>
    <button id="skip">Passer ⏭</button><button id="restart">Recommencer ↻</button>
  </div>
  <div id="target"></div>
  <div id="scene"><div id="cube" class="hidden"></div></div>
  <div id="hint">Glisse pour faire tourner le cube · clique les lettres dans l'ordre</div>
</div>
<div id="start" class="overlay show">
  <h1>Mots mêlés 3D</h1>
  <div>Retrouve un maximum de mots en 120 secondes.</div>
  <button id="play">Jouer</button>
</div>
<div id="countdown" class="overlay"><div id="count">5</div></div>
<div id="end" class="overlay">
  <h1>Temps écoulé !</h1>
  <div id="final"></div>
  <button id="replay">Rejouer</button>
</div>

<script>
const WORDS = "ABATS ABIME ABOIS ABORD ABRIS ABUSI ACIER ADOBE ADRES AGATE AGNEA AIGLE ALBUM ALLEE ALLUM ALOES AMOUR ANGLE ANNEE ANTRE APERO ARBRE BALAI BALLE BANDE BARBE BARIL BARON BARRE BASSE BATON BATTE BAUME BAZAR BECHE BELLE BENNE BERET BETON BIERE BIJOU BILAN BILLE CABAN CABLE CACAO CADRE CAGES CAHOT CANAL CANIF CANON CAPOT CARRE CARTE CASSE CASTE CAUSE CEDRE CELLE CENTR CERNE CHAIR CHAMP DAIME DALLE DANSE DEBIT DECOR DELAI DENSE DEPOT DESIR DETTE DEVIN DIGUE DINER DODUE DOGUE DOUTE DRAME DROIT DUCHE EAUSE EBENE ECHOS ECLAT ECOLE ECRIN ECUME EDILE EFFET EGOUT ELANS ELITE EMAIL EMULE ENCRE ENFER ENVIE EPAIS EPAVE EPEES EPOUX FACON FAGOT FAIRE FALOT FARCE FARDE FAUNE FENTE FERME FETUS FIBRE FICHE FIGUE FILON FIRME FLAIR FLOTS FONTE FORME FOYER FRAIS GABLE GAINS GALON GAMIN GARDE GAREN GAULE GAZON GELUL GENIE GENOU GERBE GIBET GIGOT GLACE GLOBE GOMME GRACE GRAIN GREVE GRILL HABIT HAIES HALLE HARPE HATTE HERBE HERON HEURE HIRON HIVER HOMME HONTE HORDE HOTEL HOULE HUILE HUMUS HUTTE HYENE HYMNE ICONE IDEAL IGLOO IMAGE IMPOT INDEX INDUS IODES IRONE ISSUE  JACOT JARRE JAUGE JETON JEUDI JEUNE JONCS JOUET JOUTE JUGES JUMBO JURON KAKIS KAPOK KAYAK KENAF KIOSQ KOALA KORAN KRAAL KURDE KYRIE LABEL LACET LAINE LAIUS LAMPE LANCE LAPIN LARME LASER LATTE LAVAB LECON LEVEE LIEGE LIGNE LIVRE LOGIS LOUPS LUNDI MACON MADRE MAGIE MAIRE MAJUS MALIN MAMBO MARRE MASSE MATCH MAUVE MEDAL MENUS MERLE METAL METRO MIELS MODEM MONDE NACRE NAPPE NARRE NASSE NAVET NEANT NEIGE NENUP NERFS NICHE NOBLE NOEUD NONCE NORIA NOTRE NOYAU NUAGE NUIRE NUMER NYLON OASIS OBESE OBJET OCRES ODEUR OEUFS OFFRE OGIVE OLIVE OMBRE ONCLE ONDEE OPERA ORAGE ORDIN ORMEA OVALE OXYDE OURSE OUTIL OUVRE PAGNE PALME PANNE PAPES PAROI PARTE PASSE PATIN PAUME PECHE PEINE PERLE PETIT PHARE PIECE PILON PINCE PIQUE PISTE PLAGE QUAIS QUETE QUEUE QUINE QUOTA RADAR RAIDE RAMPE RANCE RAPIN RATON RAYON RECIF REGLE REINE REPAS REVUE RHUME RICHE RIVET ROBOT ROCHE RONDE ROUTE SABLE SABOT SACRE SALLE SALON SAPIN SAUCE SAULE SAUTE SAVON SCENE SECHE SEDAN SELLE SERPE SEUIL SIGNE SINGE SOEUR TABLE TACOT TALON TAMIS TAPIS TARTE TAUPE TAXIS TEMPO TENUE TERRE TETON THEME TIGRE TISON TOAST TONNE TORSE TOURE TRAIT ULULE UREES USAGE USINE USURE UTILE UVULE VACHE VALET VALSE VANNE VAPEU VARAN VASES VASTE VEAUX VEINE VELOS VENIN VERBE VERRE VERTU VESPA VETIR VIEUX VIGNE WAGON WATTS WEBER WURST XENON XYLEM YACHT YAOUR YUCCA ZEBRE ZESTE ZONAL ZONES ZORRO".split(' ');

const N = 5, M = N - 1;
const $ = id => document.getElementById(id);
const key = (x, y, z) => x + ',' + y + ',' + z;

// Anneaux : pour chaque axe et chaque tranche, le périmètre de 16 cases tournant autour du cube
const perim = [];
for (let i = 0; i < N; i++) perim.push([i, 0]);
for (let i = 1; i < N; i++) perim.push([M, i]);
for (let i = M - 1; i >= 0; i--) perim.push([i, M]);
for (let i = M - 1; i >= 1; i--) perim.push([0, i]);
const RINGS = [];
for (let a = 0; a < 3; a++) for (let k = 0; k < N; k++) {
  const ring = perim.map(([u, v]) => {
    const c = [0, 0, 0];
    c[a] = k; c[(a + 1) % 3] = u; c[(a + 2) % 3] = v;
    return key(...c);
  });
  ring.outer = k === 0 || k === M;
  RINGS.push(ring);
}
const L = perim.length;
const windows = (ring, f) => {
  for (let s = 0; s < L; s++) for (const d of [1, -1]) {
    const ids = [];
    for (let i = 0; i < N; i++) ids.push(ring[((s + d * i) % L + L) % L]);
    // Un anneau de bord (tranche 0 ou 4) est le contour d'une face : on interdit les virages
    if (ring.outer && !straight(ids)) continue;
    if (f(ids)) return;
  }
};
const straight = ids => {
  const p = ids.map(i => i.split(',').map(Number));
  return [0, 1, 2].filter(a => p.every(q => q[a] === p[0][a])).length >= 2;
};

let grid, placed, pool, target, found, score, mode = 'idle', timer;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

function buildGrid() {
  grid = {}; placed = [];
  const used = new Set();
  const words = shuffle(WORDS.slice());
  for (const w of words) {
    if (placed.length >= 14) break;
    if (used.has(w)) continue;
    const opts = [];
    RINGS.forEach(r => windows(r, ids => {
      if (ids.every((id, i) => !grid[id] || grid[id] === w[i])) opts.push(ids);
    }));
    if (!opts.length) continue;
    const ids = opts[Math.random() * opts.length | 0];
    ids.forEach((id, i) => grid[id] = w[i]);
    used.add(w); placed.push(w);
  }
  const letters = 'AEIRSNTOLUDCMPGBVHFQYXJKZW';
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) for (let z = 0; z < N; z++) {
    if (x % M && y % M && z % M) continue;
    const k = key(x, y, z);
    if (!grid[k]) grid[k] = letters[Math.pow(Math.random(), 1.6) * letters.length | 0];
  }
  pool = shuffle(placed.slice());
}

const FACES = [
  ['rotateY(0deg)',   (c, r) => key(c, r, M)],
  ['rotateY(180deg)', (c, r) => key(M - c, r, 0)],
  ['rotateY(90deg)',  (c, r) => key(M, r, M - c)],
  ['rotateY(-90deg)', (c, r) => key(0, r, c)],
  ['rotateX(90deg)',  (c, r) => key(c, 0, r)],
  ['rotateX(-90deg)', (c, r) => key(c, M, M - r)],
];

const cube = $('cube');
function renderCube() {
  cube.innerHTML = '';
  FACES.forEach(([t, map]) => {
    const f = document.createElement('div');
    f.className = 'face';
    f.style.transform = t + ' translateZ(calc(var(--s) / 2))';
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const id = map(c, r);
      const d = document.createElement('div');
      d.className = 'cell'; d.dataset.id = id; d.textContent = grid[id];
      f.appendChild(d);
    }
    cube.appendChild(f);
  });
}
const cellsOf = id => cube.querySelectorAll('.cell[data-id="' + id + '"]');
const mark = (ids, cls, on = true) => ids.forEach(id => cellsOf(id).forEach(e => e.classList.toggle(cls, on)));

function size() {
  const s = Math.min(innerWidth * .62, ($('scene').clientHeight || 400) * .55, 360);
  cube.style.setProperty('--s', s + 'px');
}
addEventListener('resize', size);

// Rotation par glisser
let rx = -25, ry = -35;
const applyRot = () => cube.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
let drag = null;
const scene = $('scene');
scene.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: false }; });
addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 8) return;
  drag.moved = true;
  ry += dx * .6; rx -= dy * .6;
  drag.x = e.clientX; drag.y = e.clientY;
  applyRot();
});
addEventListener('pointerup', e => {
  if (!drag) return;
  const was = drag; drag = null;
  if (was.moved) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (el && el.classList.contains('cell')) clickCell(el.dataset.id);
});
addEventListener('pointercancel', () => drag = null);

// Jeu
let sel = [];
function setTarget(w) {
  $('target').innerHTML = '';
  for (let i = 0; i < N; i++) {
    const t = document.createElement('div');
    t.className = 't'; t.textContent = w[i] || '';
    $('target').appendChild(t);
  }
}
function occurrences(word) {
  const out = [];
  RINGS.forEach(r => windows(r, ids => { if (ids.map(i => grid[i]).join('') === word) out.push(ids); }));
  return out;
}
function clearSel(cls = 'sel') { mark(sel, cls, false); sel = []; }
function nextWord() {
  if (!pool.length) { buildGrid(); renderCube(); }
  target = pool.pop();
  setTarget(target);
  sel = [];
}
function clickCell(id) {
  if (mode !== 'play') return;
  if (sel.length && sel[sel.length - 1] === id) { mark([id], 'sel', false); sel.pop(); return; }
  const next = target[sel.length];
  if (grid[id] !== next) {
    clearSel();
    if (grid[id] === target[0]) { sel = [id]; mark(sel, 'sel'); }
    return;
  }
  sel.push(id); mark([id], 'sel');
  if (sel.length < N) return;
  const ok = occurrences(target).some(o => o.every((v, i) => v === sel[i]));
  const done = sel.slice();
  mark(done, 'sel', false); sel = [];
  mark(done, ok ? 'ok' : 'bad');
  setTimeout(() => mark(done, ok ? 'ok' : 'bad', false), 300);
  if (ok) { score++; $('score').textContent = score; nextWord(); }
}

function startGame() {
  buildGrid(); renderCube(); size();
  cube.classList.add('hidden');
  score = 0; $('score').textContent = 0; $('time').textContent = 120;
  setTarget('');
  ['start', 'end'].forEach(i => $(i).classList.remove('show'));
  $('countdown').classList.add('show');
  mode = 'count';
  let n = 5; $('count').textContent = n;
  clearInterval(timer);
  timer = setInterval(() => {
    n--;
    if (n > 0) { $('count').textContent = n; return; }
    clearInterval(timer);
    $('countdown').classList.remove('show');
    cube.classList.remove('hidden');
    mode = 'play'; nextWord();
    const end = Date.now() + 120000;
    timer = setInterval(() => {
      const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      $('time').textContent = left;
      if (left <= 0) endGame();
    }, 100);
  }, 1000);
}
function endGame() {
  clearInterval(timer); mode = 'over';
  $('final').textContent = `Score : ${score} mot${score > 1 ? 's' : ''} trouvé${score > 1 ? 's' : ''}`;
  $('end').classList.add('show');
}
$('play').onclick = $('replay').onclick = $('restart').onclick = startGame;
$('skip').onclick = () => { if (mode === 'play') { clearSel(); nextWord(); } };

buildGrid(); renderCube(); size(); applyRot(); setTarget('');
</script>
</body>
</html>
